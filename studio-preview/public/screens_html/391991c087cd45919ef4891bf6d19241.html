<!-- Interactive Logic for Muscle Group Selection & Filter -->
<script>
    (function initLogLiftSheet() {
      const cards = document.querySelectorAll('.category-card');
      const searchInput = document.getElementById('muscle-search');
      const clearBtn = document.getElementById('clear-search');
      const proceedBtn = document.getElementById('continue-button');

      let currentSelected = 'Chest';

      cards.forEach(card => {
        card.addEventListener('click', () => {
          cards.forEach(c => {
            c.classList.remove('bg-surface-variant', 'shadow-[0_0_16px_rgba(189,245,50,0.22)]');
            c.classList.add('bg-surface-container-high');
            c.setAttribute('aria-pressed', 'false');
            
            // Clean up pill badge if present
            const badge = c.querySelector('.category-badge');
            if (badge) badge.remove();
          });

          card.classList.remove('bg-surface-container-high');
          card.classList.add('bg-surface-variant', 'shadow-[0_0_16px_rgba(189,245,50,0.22)]');
          card.setAttribute('aria-pressed', 'true');

          const name = card.querySelector('span.font-headline-sm')?.textContent.trim() || 'Selected Group';
          currentSelected = name;
          proceedBtn.innerHTML = `<span>Proceed to Exercises (${name})</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span>`;
        });
      });

      // Quick Filter Execution
      searchInput.addEventListener('input', (e) => {
        const val = e.target.value.toLowerCase().trim();
        clearBtn.classList.toggle('hidden', val.length === 0);

        cards.forEach(card => {
          const group = card.getAttribute('data-group');
          if (group.includes(val)) {
            card.style.display = card.getAttribute('data-group') === 'full body' ? 'flex' : 'flex';
          } else {
            card.style.display = 'none';
          }
        });
      });

      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearBtn.classList.add('hidden');
        cards.forEach(card => {
          card.style.display = 'flex';
        });
        searchInput.focus();
      });
    })();
