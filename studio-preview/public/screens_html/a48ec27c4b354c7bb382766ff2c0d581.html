  function selectMuscleGroup(element, groupKey) {
    const allButtons = document.querySelectorAll('#muscle-grid button, [data-group="full-body"]');
    allButtons.forEach(btn => {
      btn.classList.remove('ring-2', 'ring-primary', 'bg-surface-container-high', 'shadow-[0_0_20px_rgba(245,158,11,0.2)]');
      const dot = btn.querySelector('.category-indicator');
      if (dot) {
        dot.classList.remove('bg-primary', 'shadow-[0_0_8px_rgba(245,158,11,0.8)]');
        dot.classList.add('bg-surface-variant');
      }
    });

    element.classList.add('ring-2', 'ring-primary', 'bg-surface-container-high', 'shadow-[0_0_20px_rgba(245,158,11,0.2)]');
    const activeDot = element.querySelector('.category-indicator');
    if (activeDot) {
      activeDot.classList.remove('bg-surface-variant');
      activeDot.classList.add('bg-primary', 'shadow-[0_0_8px_rgba(245,158,11,0.8)]');
    }

    const confirmBtn = document.getElementById('confirm-btn');
    if (confirmBtn) {
      confirmBtn.removeAttribute('disabled');
      confirmBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-surface-container-high', 'text-on-surface-variant');
